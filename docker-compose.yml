name: de-portfolio

x-airflow-env: &airflow-env
  AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTOR: SequentialExecutor
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  PORTFOLIO_ROOT: /opt/project
  PYTHONPATH: /opt/project:/opt/project/03-dq-framework
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
  SPARK_MASTER: ${SPARK_MASTER:-spark://spark-master:7077}
  SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
  SPARK_CORES_MAX: ${SPARK_CORES_MAX:-2}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-order.events}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-lake}
  DWH_DSN: postgresql://${POSTGRES_USER:-dwh}:${POSTGRES_PASSWORD:-dwh}@postgres:5432/${POSTGRES_DB:-dwh}
  AIRFLOW_CONN_DWH: postgresql://${POSTGRES_USER:-dwh}:${POSTGRES_PASSWORD:-dwh}@postgres:5432/${POSTGRES_DB:-dwh}

x-airflow-volumes: &airflow-volumes
  - ./:/opt/project
  - airflow_home:/opt/airflow
  - ivy_cache:/home/airflow/.ivy2

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dwh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh}
      POSTGRES_DB: ${POSTGRES_DB:-dwh}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./:/opt/project:ro
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dwh} -d $${POSTGRES_DB:-dwh}"]
      interval: 5s
      timeout: 5s
      retries: 30

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: pgsty/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lake}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set lake http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; do
          echo "waiting for minio..."
          sleep 3
        done
        mc mb --ignore-existing "lake/$$S3_BUCKET"
        mc ls "lake/$$S3_BUCKET"
        echo "minio bucket ready"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./04-clickhouse-marts/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  spark-master:
    image: apache/spark:3.5.1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
    environment:
      SPARK_NO_DAEMON: "true"
      SPARK_MASTER_WEBUI_PORT: "8080"
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    image: apache/spark:3.5.1
    depends_on:
      - spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 2g
    environment:
      SPARK_NO_DAEMON: "true"

  airflow:
    build:
      context: ./docker/airflow
    image: de-portfolio/airflow:2.9.3
    command: ["bash", "/opt/project/scripts/airflow_start.sh"]
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    ports:
      - "8080:8080"
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      minio:
        condition: service_started
      spark-master:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  dq-exporter:
    build:
      context: ./docker/airflow
    image: de-portfolio/airflow:2.9.3
    command: ["python", "-m", "monitoring.exporter"]
    environment:
      <<: *airflow-env
      DQ_EXPORTER_PORT: "9109"
    ports:
      - "9109:9109"
    volumes: *airflow-volumes
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./03-dq-framework/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/dwh-dq.json
    volumes:
      - ./03-dq-framework/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./03-dq-framework/monitoring/grafana-dq-dashboard.json:/var/lib/grafana/dashboards/dwh-dq.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  kafka_data:
  minio_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:
  airflow_home:
  ivy_cache:
