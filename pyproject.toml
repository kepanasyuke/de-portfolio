[project]
name = "de-portfolio"
version = "0.1.0"
description = "Portfolio of production-grade data engineering projects (Airflow, Spark, Kafka, DWH, data quality)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = [
    "02-streaming-kafka/tests",
    "03-dq-framework/tests",
    "05-migration-parity/tests",
]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
