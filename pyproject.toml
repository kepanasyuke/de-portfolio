[project]
name = "de-portfolio"
version = "0.1.0"
description = "Portfolio of production-grade data engineering projects (Airflow, Spark, Kafka, DWH, data quality)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "02-streaming-kafka/tests",
    "03-dq-framework/tests",
    "05-migration-parity/tests",
]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["data", "jars"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PIE",
    "PLR0911",
]
ignore = [
    "E501",
    "SIM108",
    "RET504",
    "RET505",
    "RET507",
    "RET508",
]

[tool.ruff.lint.pylint]
max-returns = 1
