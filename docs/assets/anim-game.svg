<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" width="820" height="220" role="img" aria-label="Труба пайплайна: сетка модулей, Clean уводит грязные записи в карантин">
  <style>
    .bg    { fill: #0b1020; }
    .grid  { stroke: rgba(34, 48, 90, .45); stroke-width: 1; }
    .node  { fill: #182245; stroke: #23305a; stroke-width: 1.5; }
    .clean { fill: rgba(255, 180, 84, .12); stroke: #ffb454; stroke-width: 1.5; }
    .pipe  { fill: none; stroke: #3b4d7c; stroke-width: 8; stroke-linecap: round; }
    .flow  { fill: none; stroke: #4dd4ac; stroke-width: 2; stroke-dasharray: 6 14; animation: dash 1.3s linear infinite; }
    .flow-q{ fill: none; stroke: #ff6b6b; stroke-width: 2; stroke-dasharray: 5 12; animation: dash 1.7s linear infinite; }
    .t     { fill: #e8eefc; font: 600 12px 'Segoe UI', Arial, sans-serif; }
    .s     { fill: #8ea0c9; font: 10px 'Segoe UI', Arial, sans-serif; }
    .dot   { fill: #4dd4ac; }
    .dot-q { fill: #ff6b6b; }
    .d1 { animation: run 3.4s linear infinite; }
    .d2 { animation: run 3.4s linear infinite 1.15s; }
    .d3 { animation: run 3.4s linear infinite 2.3s; }
    .q1 { animation: branch 3.4s linear infinite; }
    .q2 { animation: branch 3.4s linear infinite 1.7s; }
    @keyframes dash { to { stroke-dashoffset: -40; } }
    @keyframes run  { from { transform: translateX(0); } to { transform: translateX(536px); } }
    @keyframes branch {
      0%   { transform: translate(0, 0); }
      35%  { transform: translate(0, 64px); }
      100% { transform: translate(288px, 64px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .flow-q, .d1, .d2, .d3, .q1, .q2 { animation: none; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="820" height="220" rx="16"/>

  <g opacity="0.55">
    <path class="grid" d="M60 20V200 M120 20V200 M180 20V200 M240 20V200 M300 20V200 M360 20V200 M420 20V200 M480 20V200 M540 20V200 M600 20V200 M660 20V200 M720 20V200"/>
    <path class="grid" d="M20 60H800 M20 120H800 M20 180H800"/>
  </g>

  <rect class="node" x="24" y="78" width="100" height="44" rx="10"/>
  <text class="t" x="74" y="96" text-anchor="middle">Kafka</text>
  <text class="s" x="74" y="112" text-anchor="middle">источник</text>

  <rect class="clean" x="344" y="76" width="96" height="48" rx="10"/>
  <text class="t" x="392" y="96" text-anchor="middle">Clean</text>
  <text class="s" x="392" y="112" text-anchor="middle">поверни модуль</text>

  <rect class="node" x="686" y="78" width="110" height="44" rx="10"/>
  <text class="t" x="741" y="96" text-anchor="middle">DWH</text>
  <text class="s" x="741" y="112" text-anchor="middle">витрина</text>

  <rect class="node" x="686" y="142" width="110" height="44" rx="10"/>
  <text class="t" x="741" y="160" text-anchor="middle">карантин</text>
  <text class="s" x="741" y="176" text-anchor="middle">грязные</text>

  <path class="pipe" d="M124 100H686"/>
  <path class="pipe" d="M392 124V164H686"/>

  <path class="flow" d="M124 100H686"/>
  <path class="flow-q" d="M392 124V164H686"/>

  <circle class="dot d1" cx="132" cy="100" r="5"/>
  <circle class="dot d2" cx="132" cy="100" r="5"/>
  <circle class="dot d3" cx="132" cy="100" r="5"/>

  <circle class="dot-q q1" cx="392" cy="100" r="5"/>
  <circle class="dot-q q2" cx="392" cy="100" r="5"/>

  <text class="s" x="24" y="206">клик по модулю — поворот · тупик = backpressure · очередь переполнилась — запись потеряна</text>
</svg>
